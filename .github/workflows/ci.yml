name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - run: npm ci
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Test
        if: always()
        run: npm test
      - name: Verify story
        if: always()
        run: npm run verify:story
      - name: Verify maps
        if: always()
        run: npm run verify:maps
      - name: Verify shaders
        if: always()
        run: npm run verify:shaders
      - name: Verify sheets
        if: always()
        run: npm run verify:sheets
      - name: Verify tiles
        if: always()
        run: npm run verify:tiles
      - name: Build client
        if: always()
        run: npm run build:client
      - name: Build server
        if: always()
        run: npm run build:server
